<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        connect-src https://challenges.cloudflare.com;
        frame-src https://challenges.cloudflare.com;
        base-uri 'none';
        form-action 'none';
      "
    />
    <title>RideIQ verification</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, #f3faf6 0%, #ffffff 52%),
          linear-gradient(180deg, #ffffff 0%, #f6f6f6 100%);
        color: #14212d;
      }

      #card {
        width: min(92vw, 420px);
        padding: 20px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: #5b646e;
      }

      #captcha {
        min-height: 74px;
      }

      #status {
        min-height: 24px;
        margin-top: 16px;
        color: #5b646e;
      }
    </style>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script>
      (function () {
        const query = new URLSearchParams(window.location.search || '');
        const siteKey = (query.get('site_key') || '').trim();
        const state = (query.get('state') || '').trim();
        const bridge = (query.get('bridge') || 'web').trim();
        let widgetId = null;

        function setStatus(message) {
          document.getElementById('status').textContent = message;
        }

        function serializePayload(type, extra) {
          return JSON.stringify({
            type,
            state,
            ...(extra || {}),
          });
        }

        function postBridgeMessage(type, extra) {
          const payload = serializePayload(type, extra);
          if (
            bridge === 'native' &&
            window.AuthCaptchaBridge &&
            typeof window.AuthCaptchaBridge.postMessage === 'function'
          ) {
            window.AuthCaptchaBridge.postMessage(payload);
            return;
          }

          window.parent.postMessage(payload, window.location.origin);
        }

        function notifyFailure(type, code, message) {
          setStatus(message);
          postBridgeMessage(type, {
            code: code || type,
            message,
          });
        }

        function renderCaptcha() {
          if (!siteKey) {
            notifyFailure(
              'error',
              'missing_site_key',
              'Captcha is unavailable right now. Try again later.'
            );
            return;
          }

          if (!state) {
            notifyFailure(
              'error',
              'missing_state',
              'Captcha is unavailable right now. Try again later.'
            );
            return;
          }

          if (!window.turnstile) {
            window.setTimeout(renderCaptcha, 120);
            return;
          }

          if (widgetId !== null) {
            try {
              window.turnstile.remove(widgetId);
            } catch (_) {}
            widgetId = null;
          }

          widgetId = window.turnstile.render('#captcha', {
            sitekey: siteKey,
            retry: 'auto',
            'retry-interval': 1000,
            'refresh-expired': 'auto',
            'refresh-timeout': 'auto',
            callback: function (token) {
              setStatus('Verification complete.');
              postBridgeMessage('token', { token: token });
            },
            'error-callback': function (code) {
              notifyFailure(
                'error',
                code || 'turnstile_error',
                'Captcha failed to load. Try again.'
              );
            },
            'expired-callback': function () {
              notifyFailure(
                'expired',
                'expired',
                'Verification expired. Try again.'
              );
            },
            'timeout-callback': function () {
              notifyFailure(
                'timeout',
                'timeout',
                'Verification timed out before completion. Try again.'
              );
            },
            'unsupported-callback': function () {
              notifyFailure(
                'error',
                'unsupported',
                'Captcha verification is unavailable on this device.'
              );
            },
          });
        }

        window.addEventListener('load', function () {
          setStatus('Complete the verification to continue.');
          renderCaptcha();
        });
      })();
    </script>
  </head>
  <body>
    <div id="card">
      <h1>Verify before you continue</h1>
      <p>
        Complete this short verification to keep sign-in and OTP requests
        secure.
      </p>
      <div id="captcha"></div>
      <p id="status"></p>
    </div>
  </body>
</html>
